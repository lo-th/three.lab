<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgl - random - uv</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgl - random - uv">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgl_random_uv.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgl_random_uv.jpg">
		<link type="text/css" rel="stylesheet" href="main.css">
	</head>

	<body>
		<div id="container"></div>
		<div id="info">
			<a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> - Random UV and Disolve
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.webgpu.js",
					"three/webgpu": "../build/three.webgpu.js",
					"three/tsl": "../build/three.tsl.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three';

			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
			import { HDRLoader } from 'three/addons/loaders/HDRLoader.js';
			import { DRACOLoader, DRACO_GLTF_CONFIG } from 'three/addons/loaders/DRACOLoader.js';

			import { 
				transformNormal, Fn, uniform, texture, add, div, clamp, diffuseColor, uv, floor, fract, mul,
				sub, rand, vec2, mix, float, If, min, sin, dFdx, dFdy, vec4, smoothstep, bool, normalMap 
			} from 'three/tsl';

			import { Inspector } from 'three/addons/inspector/Inspector.js';

			let camera, scene, renderer, dirLight, ground, gui, material, materialIn, uniforms, uniformsIn;

			init();

			async function init() {

				const container = document.getElementById( 'container' );

				camera = new THREE.PerspectiveCamera( 45, window.innerWidth / window.innerHeight, 0.1, 20 );
				camera.position.set( - 0.8, 0.6, 1.5 );

				scene = new THREE.Scene();

				renderer = new THREE.WebGPURenderer( { antialias: true } );
				renderer.inspector = new Inspector();
				await renderer.init();
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.toneMapping = THREE.NeutralToneMapping;
				renderer.toneMappingExposure = 0.7;
				renderer.shadowMap.enabled = true;
				renderer.shadowMap.transmitted = true;
				renderer.setAnimationLoop( render );
				
				container.appendChild( renderer.domElement );
				
				// light

				dirLight = new THREE.DirectionalLight( 0xFFFFFF, 4 );
				dirLight.position.set( - 0.5, 0.8, 0.8 );
				dirLight.castShadow = true;
				scene.add( dirLight );
				const shadow = dirLight.shadow;
				shadow.mapSize.width = shadow.mapSize.height = 1024;
				shadow.radius = 4;
				shadow.bias = -0.0005;
				const shadowCam = shadow.camera, s = 1;
				shadowCam.near = 0.5;
				shadowCam.far = 3;
				shadowCam.right = shadowCam.top	= s;
				shadowCam.left = shadowCam.bottom = - s;
				// debug shadow
				//scene.add( new THREE.CameraHelper(shadowCam) );

				// add ground plane
				const plane = new THREE.PlaneGeometry( 2, 2 );
				plane.rotateX( - Math.PI * 0.5 );
				ground = new THREE.Mesh( plane, new THREE.ShadowMaterial( { opacity: 0.8 } ) );
				ground.receiveShadow = true;
				ground.position.z = - 0.52;
				scene.add( ground );

				// texture

				const loader = new THREE.TextureLoader()

				const map = await loader.loadAsync( 'textures/rock2_c.jpg' );
				map.colorSpace = THREE.SRGBColorSpace;
				map.wrapS = map.wrapT = THREE.RepeatWrapping;
				map.flipY = false;

				const normal = await loader.loadAsync( 'textures/rock2_n.jpg' );
				normal.wrapS = normal.wrapT = THREE.RepeatWrapping;
				normal.flipY = false;

				const disolveMap = await loader.loadAsync( 'textures/shaderball_ds.jpg' );
				disolveMap.flipY = false;

				const noise = await loader.loadAsync( 'textures/noise.png' );

				// envmap

				const envLoader = new HDRLoader().setPath( 'textures/equirectangular/' );
				const envmap = await envLoader.loadAsync( 'lobe.hdr' );

				envmap.mapping = THREE.EquirectangularReflectionMapping;
				scene.background = envmap;
				scene.environment = envmap;
				scene.backgroundBlurriness = 0.5;
				scene.backgroundIntensity = 1.0;
				scene.environmentIntensity = 1.5;

				// 3d model

				const modelLoader = new GLTFLoader().setPath( 'models/gltf/' );
				modelLoader.setDRACOLoader( new DRACOLoader().setDecoderPath( DRACO_GLTF_CONFIG ) )
				const gltf = await modelLoader.loadAsync( 'ShaderBall2.glb' );

				const shaderBall = gltf.scene.children[ 0 ];

				// shaderBall is a group with 3 children : base, inside and logo
				// ao map is include in model

				let i = shaderBall.children.length, n = 0;

				while ( i -- ) {

					shaderBall.children[ i ].receiveShadow = true;
					shaderBall.children[ i ].castShadow = true;
					shaderBall.children[ i ].renderOrder = n ++;

				}

				// get ao from original material

				const aoMap = shaderBall.children[ 0 ].material.aoMap;

				// material

				material = new THREE.MeshStandardNodeMaterial({
					aoMap:aoMap, 
					roughness:0.06, 
					transparent:true, 
					side:THREE.DoubleSide,
					normalScale: new THREE.Vector2(5,-5),
					//shadowSide:THREE.BackSide,
					//premultipliedAlpha:true, 
					alphaToCoverage:true
				});
				shaderBall.children[ 0 ].material = material;

				materialIn = new THREE.MeshStandardNodeMaterial({
					aoMap:aoMap, 
					color:0x161616, 
					roughness:0.02, 
					transparent:true, 
					side:THREE.DoubleSide,
					//shadowSide:THREE.BackSide,
					//premultipliedAlpha:true, 
					alphaToCoverage:true
				})
				shaderBall.children[ 1 ].material = materialIn;

				scene.add( shaderBall );

				// disolve effect 

				const vuv = uv()
				const vuvMul = uv().mul( 10.0 );

				const disolve = uniform( 0 );
				const threshold = uniform( 0.2 );
				const alphaMap = texture( disolveMap );

				const DisolveAlpha = Fn( ( [] ) => {
				    
				    const vv = alphaMap.sample( vuv ).g;
					const r = disolve.mul( add( 1.0, threshold.mul( 2.0 ) ) ).sub( threshold );
					return clamp( vv.sub( r ).mul( div( 1.0, threshold ) ), 0.0, 1.0 );

				} )();

				const customShadow = Fn( ( [] ) => {

					const vv = alphaMap.sample( vuv ).g;
					const r = disolve.mul( add( 1.0, threshold.mul( 2.0 ) ) ).sub( threshold );
					return vec4( 0.0,0.0,0.0, clamp( vv.sub( r ).mul( div( 1.0, threshold ) ), 0.0, 1.0 ) );

				} )();

				material.opacityNode = DisolveAlpha;
				materialIn.opacityNode = DisolveAlpha;

				material.castShadowNode = customShadow;
				materialIn.castShadowNode = customShadow;

				// randomUV effect 

				const noiseMap = texture( noise );
				const mapper = texture( map );
				const enableRandom = uniform( true );
				const useNoiseMap = uniform( true );
				const debugNoise = uniform( false );
				const useSuslikMethod = uniform( false );


				const directNoise = /*@__PURE__*/ Fn( ( [ p ] ) => {

					const ip = floor( p );
					const u = fract( p );
					u.assign( u.mul( u ).mul( sub( 3.0, mul( 2.0, u ) ) ) );
					const res = mix( mix( rand( ip ), rand( ip.add( vec2( 1.0, 0.0 ) ) ), u.x ), 
						mix( rand( ip.add( vec2( 0.0, 1.0 ) ) ), rand( ip.add( vec2( 1.0, 1.0 ) ) ), u.x ), u.y );
					return res.mul( res );

				}, { p: 'vec2', return: 'float' } );

				const sum = Fn( ( [ v ] ) => {

					return v.x.add( v.y ).add( v.z );

				}, { v: 'vec4', return: 'float' } );

				const TextureNoTile = Fn( ( [ map, uv ] ) => {

					// sample variation pattern

					const k = float( 0.0 );

					If( useNoiseMap.equal( 1 ), () => {

						k.assign( noiseMap.sample( mul( 0.005, uv ) ).x );

					} ).Else( () => {

						k.assign( directNoise( uv ) );

					} );

					// compute index    

					const index = k.mul( 8.0 );
					const f = fract( index );
					const ia = float( 0.0 );
					const ib = float( 0.0 );

					If( useSuslikMethod.equal( 1 ), () => {

						ia.assign( floor( index.add( 0.5 ) ) );
						ib.assign( floor( index ) );
						f.assign( min( f, sub( 1.0, f ) ).mul( 2.0 ) );

					} ).Else( () => {

						ia.assign( floor( index ) );
						ib.assign( ia.add( 1.0 ) );

					} );

					// offsets for the different virtual patterns
					const offa = sin( vec2( 3.0, 7.0 ).mul( ia ) );

					// can replace with any other hash
					const offb = sin( vec2( 3.0, 7.0 ).mul( ib ) );

					// can replace with any other hash    
					// compute derivatives for mip-mapping
					const dx = dFdx( uv );
					const dy = dFdy( uv );

					// sample the two closest virtual patterns    
					const cola = map.sample( uv.add( offa ) ).grad( dx, dy ).toVar();
					const colb = map.sample( uv.add( offb ) ).grad( dx, dy ).toVar();

					If( debugNoise.equal( 1 ), () => {

						cola.assign( vec4( 0.1, 0.0, 0.0, 1.0 ) );
						colb.assign( vec4( 0.0, 0.0, 1.0, 1.0 ) );

					} );

					// interpolate between the two virtual patterns 
					const color = mix( cola, colb, smoothstep( 0.2, 0.8, f.sub( mul( 0.1, sum( cola.sub( colb ) ) ) ) ) ).toVar()

					If( enableRandom.equal( 0 ), () => {

						color.assign( map.sample( uv ) );

					} );

					return color;

				} );

				material.colorNode = TextureNoTile( texture( map ), uv().mul( 20.0 ) );
				material.normalNode = normalMap( TextureNoTile( texture( normal ), uv().mul( 20.0 ) ), vec2(2.0,-2.0));

				// ui

				const gui = renderer.inspector.createParameters( 'Disolve effect' );
				gui.add( disolve, 'value', 0, 1 ).name( 'Disolve' );
				gui.add( threshold, 'value', 0, 1 ).name( 'Threshold' );

				const setting = {

				}

				const gui2 = renderer.inspector.createParameters( 'Random Uv effect' );
				gui2.add( enableRandom, 'value' ).name( 'Enable Random' )
				gui2.add( useNoiseMap, 'value' ).name( 'Use Noise Map' )
				gui2.add( useSuslikMethod, 'value' ).name( 'Use Suslik Method' )
				gui2.add( debugNoise, 'value' ).name( 'Debug Noise' )

			
				const controls = new OrbitControls( camera, renderer.domElement );
				controls.addEventListener( 'change', render ); // use if there is no animation loop
				controls.minDistance = 0.3;
				controls.maxDistance = 10;
				controls.target.set( 0, 0.4, 0 );
				controls.update();

				window.addEventListener( 'resize', onWindowResize );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();
				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			//

			function render() {

				renderer.render( scene, camera );

			}

		</script>

	</body>
</html>
